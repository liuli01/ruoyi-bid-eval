# ============================================
# RuoYi-Bid-Eval 生产部署（Portainer 适用）
# 使用方式：
#   1. 在 Portainer 中创建 Stack
#   2. 粘贴本文件内容
#   3. 添加环境变量 DS_API_KEY
#   4. 部署（首次启动后端会自动初始化数据库）
# ============================================
# 注意：需先通过 GitHub Actions 构建镜像推送到 GHCR
# 或修改 image 指向你自己的镜像仓库

version: '3.8'

services:
  # ---- MySQL ----
  mysql:
    image: mysql:8.0
    container_name: bid-eval-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysqlroot}
      MYSQL_DATABASE: bid_eval_v2
      TZ: Asia/Shanghai
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --sql-mode=""
      --default-time-zone='+08:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-mysqlroot}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - bid-eval-net

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: bid-eval-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bid-eval-net

  # ---- 后端 ----
  backend:
    image: ghcr.io/liuli01/ruoyi-bid-eval-backend:${IMAGE_TAG:-latest}
    container_name: bid-eval-backend
    expose:
      - "9100"
    ports:
      - "${API_PORT:-9100}:9100"
    environment:
      APP_PORT: 9100
      APP_ROOT_PATH: /dev-api
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-mysqlroot}
      DB_DATABASE: bid_eval_v2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DS_API_KEY: ${DS_API_KEY:-}
      DS_API_BASE: https://api.deepseek.com
      DS_MODEL: deepseek-v4-flash
      APP_RELOAD: "false"
      APP_DEMO_MODE: ${APP_DEMO_MODE:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bid-eval-net

  # ---- 前端 ----
  frontend:
    image: ghcr.io/liuli01/ruoyi-bid-eval-frontend:${IMAGE_TAG:-latest}
    container_name: bid-eval-frontend
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - bid-eval-net

volumes:
  mysql_data:
    name: bid-eval-mysql-data

networks:
  bid-eval-net:
    name: bid-eval-network
    driver: bridge
