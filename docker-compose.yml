version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysqlroot
      MYSQL_DATABASE: bid_eval_v2
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 以下按文件名排序自动执行（00 → 99）
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/00-ruoyi-fastapi.sql:ro
      - ./ruoyi-fastapi-backend/sql/eval_init.sql:/docker-entrypoint-initdb.d/01-eval.sql:ro
      - ./ruoyi-fastapi-backend/sql/portal_init.sql:/docker-entrypoint-initdb.d/02-portal.sql:ro
      - ./ruoyi-fastapi-backend/sql/seed_projects.sql:/docker-entrypoint-initdb.d/03-seed_projects.sql:ro
      - ./ruoyi-fastapi-backend/sql/seed_opinions.sql:/docker-entrypoint-initdb.d/04-seed_opinions.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --sql-mode="" --default-time-zone='+08:00'
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmysqlroot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ruoyi-fastapi-backend
    image: ghcr.io/${GITHUB_REPOSITORY:-ruoyi-bid-eval}-backend:latest
    ports:
      - "9100:9100"
    environment:
      APP_PORT: 9100
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: mysqlroot
      DB_DATABASE: bid_eval_v2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DS_API_KEY: ${DS_API_KEY:-}
      DS_API_BASE: https://api.deepseek.com
      DS_MODEL: deepseek-chat
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ruoyi-fastapi-frontend
      args:
        VITE_APP_ENV: production
    image: ghcr.io/${GITHUB_REPOSITORY:-ruoyi-bid-eval}-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
