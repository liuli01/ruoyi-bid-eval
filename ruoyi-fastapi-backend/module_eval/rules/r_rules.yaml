  - field: pcg_explicitly_declined
    operator: eq
    value: false
    logic: and
  full_text: '【规则编号】D-R4

    【规则名称】母公司担保信息缺失

    【字段】内容

    【特征标签】母公司担保未披露/信息不足

    【匹配条件】报送材料未明确是否需提供母公司担保（PCG），或招标文件提及担保但报送材料未回应

    【适用阶段】通用

    【适用部门】财务部、法律事务部

    【输出意见】"报送材料未明确母公司担保安排。请补充说明：①招标文件是否要求提供母公司担保；②如要求，拟提供担保的主体和担保格式；③如拟不提供，请说明替代方案和业主沟通情况；④担保对资产负债率和担保额度的影响评估。"

    【引用案例】瓦迪萨法尔（母公司担保遗漏）'
  suggestion_template: '"报送材料未明确母公司担保安排。请补充说明：①招标文件是否要求提供母公司担保；②如要求，拟提供担保的主体和担保格式；③如拟不提供，请说明替代方案和业主沟通情况；④担保对资产负债率和担保额度的影响评估。"'
  basis: 《境外项目评审管理办法》第4章（评审资料要求：资料清单应包含母公司担保安排等信息）
