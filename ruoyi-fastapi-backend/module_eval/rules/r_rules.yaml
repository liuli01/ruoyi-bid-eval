  full_text: '【规则编号】F-R1

    【规则名称】IPC支付周期过长

    【字段】内容

    【特征标签】付款周期长

    【匹配条件】IPC→实际付款周期≥45天

    【适用阶段】D&C

    【适用部门】财务部

