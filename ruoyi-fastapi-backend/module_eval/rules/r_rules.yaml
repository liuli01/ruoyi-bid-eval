  full_text: '【规则编号】R-G2

    【规则名称】停工权/解约权

    【字段】内容

    【特征标签】停工权条件苛刻

    【匹配条件】合同限制了承包商的停工权或解约权（如要求业主未付款达50%才可停工）

    【适用阶段】D&C

    【适用部门】法律事务部、海外部

    【输出意见】"请全面梳理合同条款，确认是否约定承包商的停工权和解约权。如未约定或条件苛刻，请争取增加或优化相关条款，制定业主不同意情况下的应对措施。"

    【引用案例】奇迪亚（50%）、樟宜T5、布里斯班（D&C条款清单未约定停工权）'
  suggestion_template: '"请全面梳理合同条款，确认是否约定承包商的停工权和解约权。如未约定或条件苛刻，请争取增加或优化相关条款，制定业主不同意情况下的应对措施。"'
  basis: FIDIC红皮书/黄皮书第16条（承包商暂停与终止）：停工权和解约权是承包商的基本合同权利
