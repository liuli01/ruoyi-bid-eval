  - 不配合融资
  confidence: 0.95
  conditions:
  - field: requires_financing_support
    operator: eq
    value: true
  rule_nature: preventive_reminder
  rule_nature_note: 本条为预防性提醒规则。无论材料是否显示业主自有资金、是否存在融资安排，只要项目涉及海外承包工程，就应触发此规则。评审意见的价值在于'提前确保'我方立场，而非'发现融资风险'。即使材料显示'业主自有资金'，也应触发并输出'建议明确我方不提供融资担保'的预防性意见。
  full_text: '【规则编号】R-C2

    【规则名称】项目融资担保

    【字段】内容

    【特征标签】项目融资/业主融资要求

    【匹配条件】项目涉及融资安排，业主可能要求承包商提供增信

    【适用阶段】通用

    【适用部门】财务部

    【输出意见】"招标文件在项目融资/业主融资相关条款中要求承包商配合融资安排。建议进一步在投标文件中明确我方不负责项目融资，不为项目融资提供任何形式的母公司担保或增信措施。如招标文件中存在其他要求提供母公司担保（PCG）的条款，请一并评估对资产负债率和担保额度的影响，严格履行担保审批决策程序。"

    【引用案例】瓦迪萨法尔、奇迪亚、NEOM海岸警卫队'
  suggestion_template: '"招标文件在项目融资/业主融资相关条款中要求承包商配合融资安排。建议进一步在投标文件中明确我方不负责项目融资，不为项目融资提供任何形式的母公司担保或增信措施。如招标文件中存在其他要求提供母公司担保（PCG）的条款，请一并评估对资产负债率和担保额度的影响，严格履行担保审批决策程序。"'
  basis: 《境外项目评审管理办法》第4章（评审范围：应评估融资担保需求和增信措施风险）
