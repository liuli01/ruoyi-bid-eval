  full_text: '【规则编号】D-R3

    【规则名称】业主资金来源信息缺失

    【字段】内容

    【特征标签】资金来源未披露/信息不足

    【匹配条件】报送材料未明确披露业主资金来源（政府拨款/主权基金/自筹）或资金落实情况

    【适用阶段】通用

    【适用部门】海外部、财务部

    【输出意见】"报送材料未充分披露业主资金来源及落实情况。请补充说明：①业主资金来源类型及占比；②资金已落实的证明文件；③如为融资项目，请说明融资关闭条件及进度；④是否提交基于出口信用保险（ECA）融资的备选报价。"

    【引用案例】瓦迪萨法尔（项目资金风险遗漏）、NEOM海岸警卫队（业主资金落实遗漏）'
  suggestion_template: '"报送材料未充分披露业主资金来源及落实情况。请补充说明：①业主资金来源类型及占比；②资金已落实的证明文件；③如为融资项目，请说明融资关闭条件及进度；④是否提交基于出口信用保险（ECA）融资的备选报价。"'
  basis: 《境外项目评审管理办法》第4章（评审资料要求：资料清单应包含业主资金来源等信息）
