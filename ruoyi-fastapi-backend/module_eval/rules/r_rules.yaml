    【特征标签】承包商违约责任无上限或上限过高

    【匹配条件】合同未约定承包商违约责任上限或上限>100%

    【适用阶段】通用

    【适用部门】财务部、法律事务部、海外部

    【输出意见】"合同约定承包商最大违约责任为合同价格的{当前比例}。国际工程惯例通常以合同额为上限（FIDIC 17.6），建议争取明确上限不高于合同价格的100%，并明确该上限为承包商在合同项下的最终和唯一的金钱赔偿责任上限，同时关注是否存在例外情形导致该上限不适用。"

    【谈判目标值】守住100%为底线，争取更低比例

    【引用案例】樟宜T5、布里斯班（75%→争取50%）'
  suggestion_template: '"合同约定承包商最大违约责任为合同价格的{当前比例}。国际工程惯例通常以合同额为上限（FIDIC 17.6），建议争取明确上限不高于合同价格的100%，并明确该上限为承包商在合同项下的最终和唯一的金钱赔偿责任上限，同时关注是否存在例外情形导致该上限不适用。"'
  basis: FIDIC红皮书/黄皮书第17.6条（责任上限）：承包商赔偿责任上限通常为合同额，超出应特别关注
