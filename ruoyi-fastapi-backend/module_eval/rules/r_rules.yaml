  full_text: '【规则编号】D-R5

    【规则名称】联营体决策机制信息缺失

    【字段】内容

    【特征标签】联营体机制未披露/信息不足

    【匹配条件】报送材料提及联营体但未披露决策机制、分工安排或僵局解决方案

    【适用阶段】通用

    【适用部门】法律事务部、财务部

    【输出意见】"报送材料提及联营体安排但未充分披露治理机制。请补充说明：①联营体各方具体分工（投标阶段和履约阶段）；②重大事项决策机制及僵局解决方案；③各方财税权责和并表安排；④是否已签订或计划签订标前协议/联营体协议。"

    【引用案例】NEOM海岸警卫队（内部联合体分工遗漏）'
  suggestion_template: '"报送材料提及联营体安排但未充分披露治理机制。请补充说明：①联营体各方具体分工（投标阶段和履约阶段）；②重大事项决策机制及僵局解决方案；③各方财税权责和并表安排；④是否已签订或计划签订标前协议/联营体协议。"'
  basis: 《境外项目评审管理办法》第4章（评审资料要求：资料清单应包含联营体治理机制等信息）
