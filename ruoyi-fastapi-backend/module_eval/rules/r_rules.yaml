  full_text: '【规则编号】R-D4

    【规则名称】罚款计价基数

    【字段】内容

    【特征标签】罚款计价基数不明确

    【匹配条件】项目按多阶段/多标段/多单位工程分别设定完工日期和误期罚款，但罚款比例未明确以各自合同额为基数；或误期罚款条款涉及第三方协议成本赔偿；或未明确误期损害违约金为唯一赔偿责任

    【适用阶段】D&C

    【适用部门】海外部

    【输出意见】"项目按{数量}个{阶段/标段/单位工程}分别设定了完工日期和误期罚款，建议明确各阶段误期罚款的计价基数以对应的合同金额为准，避免按合同总价重复计算。同时，建议明确误期损害违约金是承包商对其拖延完工的唯一赔偿责任。如合同中约定承包商应赔偿业主在第三方协议下发生的成本，建议争取删除或限定该等赔偿责任的上限，避免误期罚款之外的额外敞口。"

    【引用案例】奇迪亚'
  suggestion_template: '"项目按{数量}个{阶段/标段/单位工程}分别设定了完工日期和误期罚款，建议明确各阶段误期罚款的计价基数以对应的合同金额为准，避免按合同总价重复计算。同时，建议明确误期损害违约金是承包商对其拖延完工的唯一赔偿责任。如合同中约定承包商应赔偿业主在第三方协议下发生的成本，建议争取删除或限定该等赔偿责任的上限，避免误期罚款之外的额外敞口。"'
  basis: FIDIC红皮书/黄皮书第8.7条（误期损害赔偿费）：多标段罚款计算基数应为各标段合同金额
- rule_id: R-E1
  name: 业主设计+固定总价（含设计责任归属）
  priority: high
  department:
