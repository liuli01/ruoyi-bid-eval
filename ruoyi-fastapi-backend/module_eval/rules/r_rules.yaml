- rule_id: R-G4
  name: 不可预见条件索赔
  department:
  - 法律事务部
  - 海外部
  applicable_stage:
  - D&C
  trigger_keywords:
  - 不可预见
  - 不可知障碍物
  - 地下障碍物
  - 排除索赔权
  confidence: 0.95
  conditions:
  - field: raw_text
    operator: contains
    value: 不可预见
  trigger_scenarios:
  - 项目位于地质条件复杂区域（山崖、软土、岩溶、地下水位高等），或项目涉及大型地下工程、深基础施工
  - 项目材料中已提及地质勘察、地下障碍物、特殊地基处理等内容，即使合同条款未明确排除索赔权，也应提醒关注不可预见条件风险
  - 国际工程项目中，地下物理条件风险通常由业主承担，如合同未明确此原则，应触发提醒
  full_text: '【规则编号】R-G4

    【规则名称】不可预见条件索赔

    【字段】内容

    【特征标签】不可预见/不可知障碍物

    【匹配条件】合同排除了承包商的不可预见条件索赔权（如樟宜T5地下障碍物）

    【适用阶段】D&C

    【适用部门】法律事务部、海外部

    【输出意见】"据特殊条款第{条款号}条，承包商不能因{障碍物类型}获得费用和工期补偿。建议明确由业主承担{相关条件}风险，并审慎核实{相关条件}，高度关注{风险名称}。"

    【引用案例】樟宜T5（地下障碍物）、奇迪亚（不可预见物质条件）'
  suggestion_template: '"据特殊条款第{条款号}条，承包商不能因{障碍物类型}获得费用和工期补偿。建议明确由业主承担{相关条件}风险，并审慎核实{相关条件}，高度关注{风险名称}。"'
  basis: FIDIC红皮书/黄皮书第4.12条（不可预见物质条件）：承包商有权就不利物质条件提出索赔
