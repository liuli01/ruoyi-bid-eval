- rule_id: D-R1
  name: 工期条款信息缺失
  department: 海外部
  applicable_stage:
  - 通用
  trigger_keywords:
  - 工期条款未披露
  - 误期罚款未披露
  - 工期信息不足
  confidence: 0.8
  conditions:
  - field: schedule_info_disclosed
    operator: eq
    value: false
  full_text: '【规则编号】D-R1

    【规则名称】工期条款信息缺失

    【字段】内容

    【特征标签】工期条款未披露/信息不足

    【匹配条件】报送材料未明确披露合同工期、误期罚款比例或罚款上限

    【适用阶段】通用

    【适用部门】海外部

    【输出意见】"报送材料未充分披露合同工期安排及误期罚款具体条款。请补充说明：①合同总工期及关键里程碑节点；②误期罚款日费率及合同额上限比例；③是否存在阶段性罚款与总工期罚款的重叠；④非承包商原因延误的工期和费用索赔权安排。"

    【引用案例】NEOM海岸警卫队（工期风险遗漏）'
  suggestion_template: '"报送材料未充分披露合同工期安排及误期罚款具体条款。请补充说明：①合同总工期及关键里程碑节点；②误期罚款日费率及合同额上限比例；③是否存在阶段性罚款与总工期罚款的重叠；④非承包商原因延误的工期和费用索赔权安排。"'
  basis: 《境外项目评审管理办法》第4章（评审资料要求：资料清单应包含工期、误期罚款等信息）
