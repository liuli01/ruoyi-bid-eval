  full_text: '【规则编号】R-C1

    【规则名称】母公司担保评估与替代方案（修正版）

    【字段】内容

    【特征标签】母公司担保要求

    【匹配条件】招标文件要求母公司担保

    【适用阶段】ECI / D&C

    【适用部门】财务部、法律事务部

    【输出意见】①财务角度：请评估母公司担保对公司资产负债率和担保额度占用的影响，严格履行担保审批决策程序。如可行，争取由项目责任主体（子企业层级）提供担保，而非股份公司直接出具。如决策同意出具担保，建议向业主澄清确认担保提供主体和担保格式，明确如后续担保格式不符合要求无法出具时，我方将承担何种法律责任。②法律角度：请澄清在投标文件中注明"提供母公司担保和担保人名称"的法律性质和效果；如决策同意出具担保但因后续担保格式不符合要求等原因无法出具，我方将承担何种法律责任。③替代方案：如股份公司无法出具担保，请研究中建国际提供母公司担保、中建八局提供增信的可能性，以及向业主提交我方可接受的替代担保方案。

    【谈判目标值】争取由子企业层级的法人主体提供担保，降低股份公司担保敞口

    【引用案例】瓦迪萨法尔、奇迪亚、布里斯班'
  suggestion_template: '①财务角度：请评估母公司担保对公司资产负债率和担保额度占用的影响，严格履行担保审批决策程序。如可行，争取由项目责任主体（子企业层级）提供担保，而非股份公司直接出具。如决策同意出具担保，建议向业主澄清确认担保提供主体和担保格式，明确如后续担保格式不符合要求无法出具时，我方将承担何种法律责任。②法律角度：请澄清在投标文件中注明"提供母公司担保和担保人名称"的法律性质和效果；如决策同意出具担保但因后续担保格式不符合要求等原因无法出具，我方将承担何种法律责任。③替代方案：如股份公司无法出具担保，请研究中建国际提供母公司担保、中建八局提供增信的可能性，以及向业主提交我方可接受的替代担保方案。

    '
  basis: 《境外项目评审管理办法》第3章（提级评审类第3项：需股份公司提供担保的项目应提级评审）
