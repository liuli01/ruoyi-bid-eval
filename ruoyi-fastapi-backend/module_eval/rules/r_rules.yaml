  - 设计缺陷
  confidence: 0.75
  conditions:
  - field: design_responsibility
    operator: eq
    value: 业主
  - field: pricing_type
    operator: eq
    value: 固定总价
    logic: and
  full_text: '【规则编号】R-E1

    【规则名称】业主设计+固定总价（含设计责任归属）

    【字段】内容

    【特征标签】业主设计/业主负责设计 + 固定总价

    【匹配条件】业主负责设计且计价方式为固定总价

    【适用阶段】D&C

    【适用部门】法律事务部、海外部、科技与设计管理部

    【输出意见】"本项目由业主负责设计，计价方式为固定总价。①法律角度：建议明确项目设计责任由业主承担，承包商仅对施工符合设计图纸和技术规范负责。如因业主设计缺陷导致工期延误或成本增加，承包商有权获得工期延长和费用补偿。②商务角度：建议充分评估业主提供图纸和资料的准确性对投标报价的影响，防范价格风险，并争取成本变动时的调价机制。③技术角度：建议提前制定技术报审计划，确保设计变更和优化建议得到及时审批。"

    【引用案例】奇迪亚、瓦迪萨法尔、樟宜T5'
  suggestion_template: '"本项目由业主负责设计，计价方式为固定总价。①法律角度：建议明确项目设计责任由业主承担，承包商仅对施工符合设计图纸和技术规范负责。如因业主设计缺陷导致工期延误或成本增加，承包商有权获得工期延长和费用补偿。②商务角度：建议充分评估业主提供图纸和资料的准确性对投标报价的影响，防范价格风险，并争取成本变动时的调价机制。③技术角度：建议提前制定技术报审计划，确保设计变更和优化建议得到及时审批。"'
  basis: FIDIC黄皮书第5条（设计义务）：业主设计+固定总价模式下应评估设计深度不足导致的价格风险
