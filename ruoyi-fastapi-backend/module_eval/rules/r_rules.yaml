  full_text: '【规则编号】D-R6

    【规则名称】保函格式信息缺失

    【字段】内容

    【特征标签】保函格式未提供/信息不足

    【匹配条件】报送材料提及保函要求但未附保函格式文本，或未说明保函关键条款（自动延期、转让、减额等）

