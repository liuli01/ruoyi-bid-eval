  full_text: '【规则编号】D-R2

    【规则名称】预付款信息缺失

    【字段】内容

    【特征标签】预付款条款未披露/信息不足

    【匹配条件】报送材料未明确披露预付款比例、支付时间或与开工的关系

    【适用阶段】D&C

    【适用部门】法律事务部、财务部

    【输出意见】"报送材料未充分披露预付款条款。请补充说明：①预付款比例及币种；②预付款支付时间及与开工的关系；③预付款保函减额条款；④预付款抵扣安排。"

    【引用案例】NEOM海岸警卫队（预付款开工条件遗漏）'
  suggestion_template: '"报送材料未充分披露预付款条款。请补充说明：①预付款比例及币种；②预付款支付时间及与开工的关系；③预付款保函减额条款；④预付款抵扣安排。"'
  basis: 《境外项目评审管理办法》第4章（评审资料要求：资料清单应包含预付款等信息）
