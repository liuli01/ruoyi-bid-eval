    【特征标签】业主付款违约/现金流风险/保函替换保留金

    【匹配条件】合同中业主付款违约责任缺失或不明确；或项目涉及大额垫资/现金流压力（如保留金比例高、付款周期长）；或招标文件允许以保函替换保留金；或合同同时设定了税务保证金和保留金双重扣款

    【适用阶段】D&C

    【适用部门】财务部、金融与专项资产管理部

    【输出意见】"①业主付款违约：建议在合同中明确约定业主未按期付款的违约责任，严防过程垫资。②保留金与现金流：如保留金比例较高或付款周期较长，建议评估以保函替换保留金（Retention Bond替代Retention Money）的可行性和成本，以减轻过程现金流压力。③全周期现金流：请做好全周期项目现金流测算，明确资金峰值和资金筹措安排，提前识别资金缺口。"

    【引用案例】奇迪亚、樟宜T5（保留金/保函替换）'
  suggestion_template: '"①业主付款违约：建议在合同中明确约定业主未按期付款的违约责任，严防过程垫资。②保留金与现金流：如保留金比例较高或付款周期较长，建议评估以保函替换保留金（Retention Bond替代Retention Money）的可行性和成本，以减轻过程现金流压力。③全周期现金流：请做好全周期项目现金流测算，明确资金峰值和资金筹措安排，提前识别资金缺口。"'
