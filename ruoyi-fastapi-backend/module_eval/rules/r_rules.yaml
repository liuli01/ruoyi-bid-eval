  full_text: '【规则编号】R-L3

    【规则名称】属地实体化经营建议

    【字段】内容

    【特征标签】股份公司名义承接 / 属地实体化

    【匹配条件】以股份公司名义承接项目，且当地已有子公司或具备设立属地公司条件

    【适用阶段】通用

    【适用部门】法律事务部

    【输出意见】"请申请单位切实承担管理主体责任，与内部单位做好具体管理界面划分，落实重大事项管控机制，严控股份公司承接项目风险。同时，建议在今后投标活动中谨慎论证以股份公司名义承接项目的必要性，研判以自身名义参与项目投标的可行性，更加关注自身在该地区的资质获取和业绩积累，尝试通过联营、分包等方式加快属地公司实体化经营的进程，尽量减少股份公司境外投标、履约活动的风险。"

    【引用案例】NEOM海岸警卫队'
