  full_text: '【规则编号】P-A5

    【规则名称】提级评审——其他

    【字段】内容

    【制度依据】第2.1条第5款

    【匹配条件】股份公司要求提级评审的其他项目

    【制度要求】按股份公司要求执行'
  suggestion_template: 按股份公司要求执行
