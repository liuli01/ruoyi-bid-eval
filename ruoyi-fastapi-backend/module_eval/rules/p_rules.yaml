- rule_id: P-A1
  name: 提级评审——领导人见签
  department: 海外部
  conditions:
  - field: leader_witness_signing
    operator: eq
    value: true
  full_text: '【规则编号】P-A1

    【规则名称】提级评审——领导人见签

    【字段】内容

    【制度依据】第2.1条第1款

    【匹配条件】项目涉及我党和国家领导人见签（见证签约）

    【制度要求】自动纳入股份公司直接评审，不得由子企业自行决策

    【对应R类规则】无对应

    【触发动作】项目自动列入股份公司提级评审清单，评审结论须经股份公司总经理办公会审议'
  suggestion_template: 自动纳入股份公司直接评审，不得由子企业自行决策
  category: mandatory
  basis: 第2.1条第1款
  level: high
- rule_id: P-A2
  name: 提级评审——多边开发银行出资
  department: 海外部
  conditions:
  - field: procurement_agency
    operator: in
    value:
    - WorldBank
    - ADB
    - AfDB
  - field: bidding_entity
    operator: contains
    value: 股份公司
    logic: and
  full_text: '【规则编号】P-A2

    【规则名称】提级评审——多边开发银行出资

    【字段】内容

    【制度依据】第2.1条第2款

    【匹配条件】以股份公司（含分公司等非法人机构）名义参与的世界银行、亚洲开发银行、非洲开发银行等多边开发银行出资项目

    【制度要求】自动纳入股份公司直接评审

    【对应R类规则】无对应

    【触发动作】项目列入提级评审，同时需按中建股海函字〔2025〕44号文要求报送多边银行专项资料'
  suggestion_template: 自动纳入股份公司直接评审
  category: mandatory
  basis: 第2.1条第2款
  level: high
- rule_id: P-A3
  name: 提级评审——需股份公司增信
  department:
  - 海外部
  - 财务部
  conditions:
  - field: requires_corporate_guarantee
    operator: eq
    value: true
  - field: requires_financing_support
    operator: eq
    value: true
    logic: or
  - field: requires_liquidity_support
    operator: eq
    value: true
    logic: or
  full_text: '【规则编号】P-A3

    【规则名称】提级评审——需股份公司增信

    【字段】内容

    【制度依据】第2.1条第3款

    【匹配条件】投（议）标或实施过程中需由股份公司提供担保、融资、流动性资金等方面支持的项目

    【制度要求】自动纳入股份公司直接评审

    【对应R类规则】R-C1（母公司担保）应同步触发

    【触发动作】需同时评估担保/融资/流动性支持的类型、金额和对股份公司财务报表的影响'
  suggestion_template: 自动纳入股份公司直接评审
  category: mandatory
  basis: 第2.1条第3款
  level: high
- rule_id: P-A4
  name: 提级评审——战略性项目
  department: 海外部
  conditions:
  - field: strategic_project_listed
    operator: eq
    value: true
  full_text: '【规则编号】P-A4

    【规则名称】提级评审——战略性项目

    【字段】内容

    【制度依据】第2.1条第4款

    【匹配条件】项目已纳入股份公司战略性项目清单

    【制度要求】自动纳入股份公司直接评审'
  suggestion_template: 自动纳入股份公司直接评审
  category: mandatory
