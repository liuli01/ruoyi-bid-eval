# 规则批次配置 — v3.0 LLM 逐条判断
# 每个批次聚焦一个维度，LLM 只接收相关材料片段，减少上下文噪音

batches:
  - batch_id: "P1"
    name: "流程制度"
    description: "提级评审、分级评审、请示函格式、评审流程"
    keywords:
      - "请示"
      - "评审"
      - "提级"
      - "战略性"
      - "授权额度"
      - "八段式"
      - "报送"
      - "流程"
    source_materials:
      - "请示函"

  - batch_id: "P2"
    name: "风险底线"
    description: "合规红线、业主资信、国别风险、工期、价格、现金流、保函、承包商权责、合同转让"
    keywords:
      - "合规"
      - "红线"
      - "业主资信"
      - "国别"
      - "误期罚款"
      - "固定总价"
      - "调价"
      - "预付款"
      - "保函"
      - "担保"
      - "违约责任"
      - "停工权"
      - "解约权"
      - "合同转让"
    source_materials:
      - "请示函"
      - "招标文件"
      - "法律意见书"

  - batch_id: "A"
    name: "联营体结构"
    description: "内部/外部联营体、权益比例、决策机制、实质性管理、合作方资信"
    keywords:
      - "联营体"
      - "联合体"
      - "权益"
      - "比例"
      - "决策"
      - "实质性管理"
      - "标前协议"
      - "合作方"
      - "资信"
      - "资产负债率"
    source_materials:
      - "请示函"
      - "联合体协议"
      - "资信调查"

  - batch_id: "B"
    name: "保函条款"
    description: "保函自动延期、减额、索赔条件、转让、分标段、系统内反担保"
    keywords:
      - "保函"
      - "guarantee"
      - "bond"
      - "自动延期"
      - "自动续期"
      - "减额"
      - "见索即付"
      - "转让"
      - "反担保"
    source_materials:
      - "招标文件"
      - "保函格式"
      - "请示函"

  - batch_id: "C"
    name: "担保与融资"
    description: "母公司担保、项目融资担保、PCG、增信"
    keywords:
      - "母公司担保"
      - "PCG"
      - "融资担保"
      - "增信"
      - "Parent Company Guarantee"
      - "担保审批"
    source_materials:
      - "请示函"
      - "招标文件"
      - "联合体协议"

  - batch_id: "D"
    name: "罚款与工期"
    description: "重复罚款、罚款上限、阶段性罚款退还、计价基数、工期条款"
    keywords:
      - "罚款"
      - "误期"
      - "违约金"
      - "上限"
      - "工期"
      - "里程碑"
      - "阶段性"
      - "退还"
    source_materials:
      - "招标文件"
      - "请示函"

  - batch_id: "E"
    name: "设计责任"
    description: "业主设计+固定总价、设计顾问、设计深度、设计转让、专项报审"
    keywords:
      - "设计"
      - "design"
      - "固定总价"
      - "设计顾问"
      - "方案设计"
      - "初步设计"
      - "Schematic"
      - "专项"
      - "报审"
    source_materials:
      - "招标文件"
      - "请示函"
      - "投标文件"

  - batch_id: "F"
    name: "现金流与支付"
    description: "IPC支付周期、垫资、预付款、保留金、税务保证金、业主付款违约、资金来源"
    keywords:
      - "现金流"
      - "垫资"
      - "预付款"
      - "进度款"
      - "IPC"
      - "保留金"
      - "税务保证金"
      - "资金来源"
      - "支付"
      - "回款"
    source_materials:
      - "招标文件"
      - "请示函"
