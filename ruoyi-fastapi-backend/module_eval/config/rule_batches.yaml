    keywords:
      - "违约责任"
      - "赔偿责任"
      - "上限"
      - "停工权"
      - "解约权"
      - "解除"
      - "不可预见"
      - "场地移交"
      - "甲指分包"
      - "Specialist"
      - "整改期"
      - "留置权"
      - "指定供应商"
    source_materials:
      - "招标文件"
      - "法律意见书"
      - "请示函"

  - batch_id: "H"
    name: "实施与技术"
    description: "商务部备案、管理团队、技术方案、当地资源、工期风险、分包招采、重难点、多标段、团队冲突"
    keywords:
      - "备案"
      - "管理团队"
      - "技术方案"
      - "当地资源"
      - "斋月"
      - "高温"
      - "雨季"
      - "分包"
      - "重难点"
      - "兼投兼中"
