[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-eval-backend"
version = "1.0.0"
description = "海外项目投标评审系统后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi[all]>=0.115",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncmy>=0.2",
    "redis>=5.0",
    "PyJWT[crypto]>=2.0",
    "bcrypt>=5.0",
    "loguru>=0.7",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pydantic-validation-decorator>=0.1",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-dateutil>=2.8",
    "annotated-doc>=0.0.4",
    "typing-extensions>=4.0",
    "litellm>=1.40",
    "agno>=2.4",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "python-docx>=1.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "aiofiles>=25.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "Pillow>=10.0",
    "psutil>=5.0",
    "PyMySQL>=1.0",
    "sqlglot>=25.0",
    "user-agents>=2.0",
    "async-lru>=2.0",
    "anthropic>=0.40",
    "openai>=1.0",
]

[tool.setuptools.packages.find]
include = ["module_eval*", "module_admin*", "module_ai*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
